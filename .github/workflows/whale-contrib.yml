name: whale-contrib

on:
  schedule:
    - cron: "17 0 * * *"      # 每天 UTC 00:17 = 北京时间 08:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate whale contribution SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: node scripts/gen-whale.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/whale-contrib.svg
          git diff --cached --quiet && echo "no change" || git commit -m "chore: refresh whale contributions"
          git push