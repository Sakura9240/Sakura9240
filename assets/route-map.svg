<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="航线图">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1322"/><stop offset="1" stop-color="#0b1a2c"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#22334a"/>
    </pattern>
    <style>
      .route{stroke-dasharray:7 9;animation:flow 5s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-48}}
      .whale{animation:drift 6s ease-in-out infinite}
      @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>
  <rect x="4" y="4" width="892" height="312" rx="24" fill="url(#sea)" stroke="#22314a" stroke-width="2"/>
  <rect x="4" y="4" width="892" height="312" rx="24" fill="url(#dots)" opacity="0.7"/>

  <path d="M120 210 C 90 180, 120 140, 170 138 C 220 136, 250 165, 245 195 C 240 228, 190 240, 155 232 C 135 226, 128 220, 120 210 Z" fill="#14243a" stroke="#2c4460" stroke-width="2"/>
  <path d="M690 120 C 660 92, 690 58, 742 60 C 796 62, 820 92, 812 124 C 804 156, 752 168, 716 156 C 700 150, 694 136, 690 120 Z" fill="#14243a" stroke="#2c4460" stroke-width="2"/>

  <text x="180" y="196" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#e8e1ff">纪要港</text>
  <text x="750" y="106" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#e8e1ff">手作岛</text>
  <text x="180" y="224" text-anchor="middle" font-size="12" fill="#8fa6c4" font-family="'JetBrains Mono',monospace">MEETING-TO-ACTION</text>
  <text x="750" y="134" text-anchor="middle" font-size="12" fill="#8fa6c4" font-family="'JetBrains Mono',monospace">SIDE PROJECTS</text>

  <path class="route" d="M250 196 C 340 258, 470 236, 540 190 C 606 148, 640 130, 688 128" fill="none" stroke="#7fc7ff" stroke-width="2.4" opacity="0.85"/>
  <g class="whale" transform="translate(520 196)">
    <path d="M0 0 C 8 -11, 27 -13, 37 -3 C 42 2, 42 9, 36 13 C 27 18, 9 16, 0 9 Z" fill="#8fd8ee"/>
    <circle cx="29" cy="1" r="1.6" fill="#0b1a24"/>
    <path d="M-2 2 C -10 -1, -13 5, -7 7 C -4 6, -2 4, -2 2 Z" fill="#8fd8ee"/>
  </g>

  <g transform="translate(792 250)" opacity="0.8">
    <circle r="24" fill="none" stroke="#31506f" stroke-width="1.4"/>
    <path d="M0 -18 L4 0 L0 18 L-4 0 Z" fill="#7fc7ff" opacity="0.7"/>
    <text y="-30" text-anchor="middle" font-size="11" fill="#8fa6c4" font-family="'Noto Sans SC',sans-serif">航向还在画</text>
  </g>

  <text x="44" y="284" font-size="13" fill="#6f86a3" font-family="'Noto Sans SC','PingFang SC',sans-serif">从「把会议记录理清楚」出发，慢慢把喜欢的东西做成能跑的东西。</text>
</svg>